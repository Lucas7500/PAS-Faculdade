server:
  port: 8080

spring:
  application:
    name: estoque-service
  datasource:
    # Valores padrão para execução local; no Docker Compose são sobrescritos
    # pelas variáveis SPRING_DATASOURCE_*.
    url: jdbc:postgresql://localhost:5432/estoque
    username: estoque
    password: estoque
  jpa:
    hibernate:
      ddl-auto: none        # o esquema é criado pelo schema.sql (modelo do enunciado)
    open-in-view: false
  sql:
    init:
      mode: always          # executa schema.sql e data.sql a cada inicialização (idempotentes)

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${spring.application.name}] %logger{20} - %msg%n"

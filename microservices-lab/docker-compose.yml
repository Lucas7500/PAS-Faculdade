services:
  rabbitmq:
    image: rabbitmq:3.13-management
    # O nome do nó (rabbit@<hostname>) define o diretório de dados. Com hostname fixo
    # e volume nomeado, filas duráveis e mensagens persistentes sobrevivem à recriação
    # do container (sem isso, cada container novo "esquece" as mensagens pendentes).
    hostname: rabbitmq
    # Tempo para o RabbitMQ gravar o Mnesia ao parar. O padrão do Docker (10s e SIGKILL)
    # pode corromper o diretório de dados (erro schema_integrity_check_failed no boot).
    stop_grace_period: 1m
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # interface de gerenciamento (guest/guest)
    healthcheck:
      # 1) Só executa o rabbitmq-diagnostics depois que o próprio servidor criou o
      #    .erlang.cookie. Caso contrário, o healthcheck (que roda como root) pode criar
      #    o arquivo antes do servidor, que então falha com "eacces" ao lê-lo.
      # 2) check_port_connectivity (em vez de ping) só fica saudável quando a porta
      #    AMQP 5672 já aceita conexões; "ping" aprova o nó antes disso.
      test: ["CMD-SHELL", "test -f /var/lib/rabbitmq/.erlang.cookie && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Bancos de dados: um por serviço (Database per Service) ----------

  estoque-db:
    image: postgres:16
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
    volumes:
      - estoque-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d estoque"]
      interval: 5s
      timeout: 3s
      retries: 10

  pedido-db:
    image: postgres:16
    environment:
      POSTGRES_DB: pedido
      POSTGRES_USER: pedido
      POSTGRES_PASSWORD: pedido
    volumes:
      - pedido-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedido -d pedido"]
      interval: 5s
      timeout: 3s
      retries: 10

  pagamento-db:
    image: postgres:16
    environment:
      POSTGRES_DB: pagamento
      POSTGRES_USER: pagamento
      POSTGRES_PASSWORD: pagamento
    volumes:
      - pagamento-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagamento -d pagamento"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------- Microsserviços ----------

  estoque-service:
    build: ./estoque-service
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://estoque-db:5432/estoque
      SPRING_DATASOURCE_USERNAME: estoque
      SPRING_DATASOURCE_PASSWORD: estoque
    depends_on:
      estoque-db:
        condition: service_healthy

  pedido-service:
    build: ./pedido-service
    ports:
      # Porta do host configurável caso a 8080 já esteja ocupada (ex.: PEDIDO_PORT=8090)
      - "${PEDIDO_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pedido-db:5432/pedido
      SPRING_DATASOURCE_USERNAME: pedido
      SPRING_DATASOURCE_PASSWORD: pedido
      SPRING_RABBITMQ_HOST: rabbitmq
      ESTOQUE_SERVICE_URL: http://estoque-service:8080
    depends_on:
      pedido-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      estoque-service:
        condition: service_started

  pagamento-service:
    build: ./pagamento-service
    # Sem "ports": a porta não é publicada no host, o que permite
    # "docker compose up --scale pagamento-service=2" sem conflito de porta.
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pagamento-db:5432/pagamento
      SPRING_DATASOURCE_USERNAME: pagamento
      SPRING_DATASOURCE_PASSWORD: pagamento
      SPRING_RABBITMQ_HOST: rabbitmq
      # Etapa 11 (investigação de incidente): informe um pedidoId para simular
      # falha no processamento desse pedido. Vazio = desabilitado.
      SIMULACAO_FALHA_PEDIDO_ID: ${SIMULACAO_FALHA_PEDIDO_ID:-}
    depends_on:
      pagamento-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq-data:
  estoque-data:
  pedido-data:
  pagamento-data:

server:
  port: 8080

spring:
  application:
    name: pedido-service
  datasource:
    # Valores padrão para execução local; no Docker Compose são sobrescritos
    # pelas variáveis SPRING_DATASOURCE_*.
    url: jdbc:postgresql://localhost:5433/pedido
    username: pedido
    password: pedido
  jpa:
    hibernate:
      ddl-auto: none        # o esquema é criado pelo schema.sql (modelo do enunciado)
    open-in-view: false
  sql:
    init:
      mode: always
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false   # falhas definitivas vão para a DLQ, sem loop infinito
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

estoque:
  service:
    url: ${ESTOQUE_SERVICE_URL:http://localhost:8081}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [${spring.application.name}] %logger{20} - %msg%n"
